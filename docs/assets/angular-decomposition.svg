<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">ICATS analysis map</title>
  <desc id="desc">How ICATS removes centre-of-mass motion, aligns molecules into the Eckart frame, reconstructs vibrational, rotational, and Jacobi quantities, and writes the round-trip analysis log.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.6; rx: 8; }
      .blue { fill: #eaf3ff; stroke: #2f6fa3; stroke-width: 1.8; rx: 8; }
      .green { fill: #eaf8f0; stroke: #2f855a; stroke-width: 1.8; rx: 8; }
      .amber { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.8; rx: 8; }
      .rose { fill: #fff1f0; stroke: #c0564a; stroke-width: 1.8; rx: 8; }
      .text { fill: #0f172a; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .small { fill: #334155; font-family: Arial, sans-serif; font-size: 13px; }
      .tiny { fill: #475569; font-family: Arial, sans-serif; font-size: 12px; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="460" rx="14"/>

  <rect class="box" x="28" y="181" width="165" height="98"/>
  <text class="text" x="52" y="214">Cartesian sample</text>
  <text class="small" x="52" y="240">atom positions</text>
  <text class="small" x="52" y="259">atom velocities</text>

  <line class="arrow" x1="193" y1="230" x2="245" y2="230"/>
  <rect class="box" x="255" y="171" width="170" height="118"/>
  <text class="text" x="282" y="204">COM removal</text>
  <text class="small" x="282" y="230">molecular COMs</text>
  <text class="small" x="282" y="249">system COM velocity</text>
  <text class="tiny" x="282" y="269">separate molecule and pair views</text>

  <line class="arrow" x1="425" y1="230" x2="478" y2="230"/>
  <rect class="green" x="488" y="168" width="198" height="124"/>
  <text class="text" x="514" y="201">Eckart frame</text>
  <text class="text" x="514" y="221">transformation</text>
  <text class="small" x="514" y="248">mass-weighted fit</text>
  <text class="small" x="514" y="267">onto reference geometry</text>

  <line class="arrow" x1="686" y1="230" x2="730" y2="104"/>
  <rect class="green" x="740" y="55" width="220" height="98"/>
  <text class="text" x="762" y="88">Normal-mode /</text>
  <text class="text" x="762" y="108">vibrational analysis</text>
  <text class="small" x="762" y="132">Q, P, v, Evib</text>

  <line class="arrow" x1="686" y1="230" x2="730" y2="230"/>
  <rect class="blue" x="740" y="181" width="220" height="98"/>
  <text class="text" x="762" y="214">Rotational analysis</text>
  <text class="small" x="762" y="240">J_full, J_vector, J_vib</text>
  <text class="small" x="762" y="259">E_vector and E_full</text>

  <line class="arrow" x1="686" y1="230" x2="730" y2="356"/>
  <rect class="amber" x="740" y="307" width="220" height="98"/>
  <text class="text" x="762" y="340">Jacobi analysis</text>
  <text class="small" x="762" y="366">R, P_R, L, b, phi</text>
  <text class="small" x="762" y="385">J = L + J_a + J_b</text>

  <line class="arrow" x1="960" y1="104" x2="997" y2="178"/>
  <line class="arrow" x1="960" y1="230" x2="997" y2="230"/>
  <line class="arrow" x1="960" y1="356" x2="997" y2="282"/>
  <rect class="rose" x="1007" y="154" width="92" height="152"/>
  <text class="text" x="1024" y="184">Round-</text>
  <text class="text" x="1024" y="204">trip log</text>
  <text class="small" x="1024" y="229">model vs.</text>
  <text class="small" x="1024" y="248">Cartesian</text>
  <text class="tiny" x="1024" y="272">audit and</text>
  <text class="tiny" x="1024" y="289">histograms</text>
</svg>
