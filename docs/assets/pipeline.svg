<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">ICATS workflow pipeline</title>
  <desc id="desc">Input files are processed by ICATS init, optionally by cheap dynamics, and then by ICATS analyse.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .box { fill: #ffffff; stroke: #24415f; stroke-width: 2; rx: 8; }
      .accent { fill: #e9f2fb; stroke: #2f6fa3; stroke-width: 2; rx: 8; }
      .text { fill: #1d2b36; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .small { fill: #425466; font-family: Arial, sans-serif; font-size: 13px; }
      .arrow { stroke: #2f6fa3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f6fa3" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="260" rx="12"/>
  <rect class="box" x="30" y="70" width="170" height="110"/>
  <text class="text" x="55" y="108">Input files</text>
  <text class="small" x="55" y="135">tutorial_input.txt</text>
  <text class="small" x="55" y="154">molecule dat/xyz</text>
  <line class="arrow" x1="210" y1="125" x2="295" y2="125"/>
  <rect class="accent" x="305" y="55" width="185" height="140"/>
  <text class="text" x="338" y="96">icats.init</text>
  <text class="small" x="330" y="124">sample HO vibrations</text>
  <text class="small" x="330" y="143">sample rotors/orbit</text>
  <text class="small" x="330" y="162">write xyz/vel</text>
  <line class="arrow" x1="500" y1="125" x2="585" y2="125"/>
  <rect class="box" x="595" y="70" width="160" height="110"/>
  <text class="text" x="622" y="108">Dynamics</text>
  <text class="small" x="622" y="135">optional toy MINDO</text>
  <text class="small" x="622" y="154">or external code</text>
  <line class="arrow" x1="765" y1="125" x2="850" y2="125"/>
  <rect class="accent" x="860" y="55" width="90" height="140"/>
  <text class="text" x="877" y="96">analyse</text>
  <text class="small" x="878" y="124">DOF</text>
  <text class="small" x="878" y="143">energy</text>
  <text class="small" x="878" y="162">checks</text>
  <rect class="box" x="305" y="210" width="185" height="32"/>
  <text class="small" x="330" y="231">audit happens before dynamics</text>
</svg>
