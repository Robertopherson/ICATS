<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">ICATS logo</title>
  <desc id="desc">A compact molecular scattering logo with two molecules, angular momentum arcs, and the ICATS name.</desc>
  <defs>
    <linearGradient id="beam" x1="70" x2="570" y1="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="0.5" stop-color="#00a878"/>
      <stop offset="1" stop-color="#f2994a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="640" height="240" rx="28" fill="#f8fafc"/>
  <path d="M 70 122 C 190 64 260 64 334 120 C 410 178 490 176 570 118" fill="none" stroke="url(#beam)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 160 122 A 44 44 0 1 1 159 121" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 472 118 A 48 48 0 1 0 473 119" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="160" cy="122" r="20" fill="#2f80ed"/>
  <circle cx="126" cy="96" r="11" fill="#94a3b8"/>
  <circle cx="193" cy="96" r="11" fill="#94a3b8"/>
  <line x1="144" y1="111" x2="132" y2="101" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="111" x2="187" y2="101" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="472" cy="118" r="18" fill="#00a878"/>
  <circle cx="514" cy="118" r="16" fill="#f2994a"/>
  <line x1="490" y1="118" x2="498" y2="118" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#0f172a">ICATS</text>
  <text x="320" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Initial conditions and trajectory sampling</text>
</svg>
