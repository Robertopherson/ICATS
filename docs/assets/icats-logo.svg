<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">ICATS logo</title>
  <desc id="desc">A compact molecular scattering logo with two molecules, angular momentum arcs, and the ICATS name.</desc>
  <defs>
    <linearGradient id="beam" x1="70" x2="570" y1="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="0.5" stop-color="#00a878"/>
      <stop offset="1" stop-color="#f2994a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="640" height="260" rx="28" fill="#f8fafc"/>
  <path d="M 70 134 C 190 76 260 76 334 132 C 410 190 490 188 570 130" fill="none" stroke="url(#beam)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 160 134 A 45 45 0 1 1 159 133" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 492 132 A 50 50 0 1 0 493 133" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="160" cy="134" r="20" fill="#2f80ed"/>
  <circle cx="126" cy="108" r="11" fill="#94a3b8"/>
  <circle cx="193" cy="108" r="11" fill="#94a3b8"/>
  <line x1="144" y1="123" x2="132" y2="113" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="123" x2="187" y2="113" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="471" cy="132" r="17" fill="#00a878"/>
  <circle cx="513" cy="132" r="17" fill="#f2994a"/>
  <line x1="488" y1="132" x2="496" y2="132" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#0f172a">ICATS</text>
  <text x="320" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Initial conditions and trajectory sampling</text>
</svg>
